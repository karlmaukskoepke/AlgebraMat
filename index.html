<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Mat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Lexend:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="screen">
      <header class="topbar">
        <button class="btn btn-quiet" disabled>&larr; Packs</button>
        <div class="title">FLIP IT &middot; Level 3</div>
        <div class="dots" aria-label="Problem 3 of 5">
          <span class="dot done"></span><span class="dot done"></span
          ><span class="dot current"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <button class="btn btn-quiet" disabled>Save code</button>
      </header>

      <ol class="steps">
        <li class="done"><span class="num">1</span> Rewrite</li>
        <li class="done"><span class="num">2</span> Draw</li>
        <li class="done"><span class="num">3</span> Party or Battle?</li>
        <li class="current" aria-current="step"><span class="num">4</span> Cancel</li>
        <li><span class="num">5</span> Answer</li>
      </ol>

      <main id="mat" class="mat-wrap"></main>

      <p class="feedback">Nice! Tap one + and one &minus; to cancel another pair.</p>

      <footer class="palette">
        <div class="group">
          <button class="btn btn-sign" disabled aria-label="Plus counter">
            <svg viewBox="-16 -16 32 32" aria-hidden="true"><line x1="-11" y1="0" x2="11" y2="0" /><line x1="0" y1="-11" x2="0" y2="11" /></svg>
          </button>
          <button class="btn btn-sign" disabled aria-label="Minus counter">
            <svg viewBox="-16 -16 32 32" aria-hidden="true"><line x1="-11" y1="0" x2="11" y2="0" /></svg>
          </button>
        </div>
        <div class="group">
          <button class="btn" disabled>Party!</button>
          <button class="btn" disabled>Battle!</button>
        </div>
        <button class="btn btn-primary">Check &check;</button>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
