<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="The Mat" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <title>The Mat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Lexend:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="home" class="home" hidden></main>

    <div class="screen" id="play" hidden>
      <header class="topbar">
        <button class="btn btn-quiet" id="back" type="button">&larr; Packs</button>
        <div class="title" id="title">FLIP IT</div>
        <div class="streak" id="streak" hidden></div>
        <div class="dots" id="dots">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span
          ><span class="dot"></span><span class="dot"></span>
        </div>
        <button class="btn btn-primary" id="next-level" type="button" hidden>Next level →</button>
        <button class="btn btn-quiet" id="save-code" type="button">Save code</button>
      </header>

      <ol class="steps" id="steps"></ol>

      <div id="mat" class="mat-wrap"></div>

      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      <p class="hint" id="hint" role="status" aria-live="polite" hidden></p>

      <footer class="palette" id="controls"></footer>
    </div>
    <div class="screen" id="quiz" hidden></div>
    <dialog id="dialog" class="dialog"></dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
